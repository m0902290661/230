<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <link rel="icon" type="png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統登入</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 320px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .flex-group {
            display: flex;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .btn-success {
            background-color: #28a745;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .fail {
            color: red;
        }

        .hidden {
            display: none;
        }

        .links-group {
            margin-top: 15px;
            text-align: right;
            font-size: 14px;
        }

        .links-group a {
            color: #007BFF;
            text-decoration: none;
        }

        .links-group a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            width: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        .toggle-password:hover {
            background: none;
            color: #333;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <!-- 一般登入區塊 -->
        <div id="loginBlock">
            <img style="height: 24px; border-radius: 5px;" src="logo.png" alt="" onerror="this.style.display='none';">
            <h2>高二智系統登入</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">帳號</label>
                    <input type="text" id="username" placeholder="4930XX" required>
                </div>
                <div class="input-group">
                    <label for="password">密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="請輸入密碼" required>
                        <button type="button" class="toggle-password" data-target="password" title="顯示/隱藏密碼">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit">登入</button>
                <div class="links-group">
                    <a href="#" id="toForgotBtn">忘記密碼？</a>
                </div>
            </form>
        </div>

        <!-- 首次登入修改密碼區塊 -->
        <div id="firstLoginBlock" class="hidden">
            <h2>首次登入設定</h2>
            <p style="font-size: 14px; color: #666; text-align: center;">偵測到您是首次登入，請先修改密碼並綁定電子郵件。</p>
            <form id="profileForm">
                <div class="input-group">
                    <label for="newPassword">新密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" required minlength="4">
                        <button type="button" class="toggle-password" data-target="newPassword" title="顯示/隱藏密碼">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">確認新密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword" title="顯示/隱藏密碼">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="email">綁定電子郵件</label>
                    <input type="email" id="email" required placeholder="example@mail.com">
                </div>
                <button type="submit" class="btn-success">儲存並登入</button>
            </form>
        </div>

        <!-- 忘記密碼/重設密碼區塊 -->
        <div id="forgotPasswordBlock" class="hidden">
            <h2>重設密碼</h2>
            <p style="font-size: 13px; color: #666; text-align: center;">請輸入帳號來獲取寄送到綁定信箱的驗證碼。</p>
            
            <div id="forgotStep1">
                <div class="input-group">
                    <label for="forgotUsername">帳號</label>
                    <div class="flex-group">
                        <input type="text" id="forgotUsername" placeholder="4930XX">
                        <button type="button" id="sendCodeBtn" style="width: auto; font-size: 14px; white-space: nowrap;">獲取驗證碼</button>
                    </div>
                </div>
            </div>

            <form id="resetPasswordForm">
                <div class="input-group">
                    <label for="resetCode">驗證碼</label>
                    <input type="text" id="resetCode" placeholder="請輸入6位數驗證碼" required disabled>
                </div>
                <div class="input-group">
                    <label for="forgotNewPassword">新密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="forgotNewPassword" placeholder="請輸入新密碼" required minlength="4" disabled>
                        <button type="button" class="toggle-password" data-target="forgotNewPassword" title="顯示/隱藏密碼">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="forgotConfirmPassword">確認新密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="forgotConfirmPassword" placeholder="再次輸入新密碼" required disabled>
                        <button type="button" class="toggle-password" data-target="forgotConfirmPassword" title="顯示/隱藏密碼">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="flex-group">
                    <button type="button" id="backToLoginBtn" class="btn-secondary">返回登入</button>
                    <button type="submit" id="resetSubmitBtn" class="btn-success" disabled>提交重設</button>
                </div>
            </form>
        </div>

        <!-- 狀態回報訊息區 -->
        <div id="message"></div>

        <div class="footer">
            <p>本系統由許元洧維護 若有問題請通報</p>
            <details>
                <summary style="cursor: pointer;">系統連線錯誤處置</summary>
                <p>前往<a href="https://shssysapi.dafuntea.com">api</a>查看錯誤代碼，若頁面顯示訪問方式錯誤（Method Not Allowed），請重新開啟班務系統分頁。</p>
                <li><span style="color: red;">錯誤代碼1033：</span>請立即通知許元洧，這是主機斷線端口不可用的嚴重狀況。</li>
            </details>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        let gasUrl = ""; 

        let userSession = {
            username: "",
            nickname: "",
            rowIndex: -1
        };

        const messageDiv = document.getElementById('message');

        function setButtonLoading(button, isLoading, loadingText) {
            if (!button) return;
            if (!button.dataset.originalText) button.dataset.originalText = button.textContent;
            button.disabled = isLoading;
            button.textContent = isLoading ? loadingText : button.dataset.originalText;
        }

        // 當網頁載入時，自動抓取 api.json[cite: 5]
        window.addEventListener('DOMContentLoaded', () => {
            fetch('api.json')
                .then(response => {
                    if (!response.ok) throw new Error("無法讀取 api.json 設定檔");
                    return response.json();
                })
                .then(config => {
                    gasUrl = config.GAS_WEB_APP_URL;
                    console.log("API 網址載入成功");
                })
                .catch(error => {
                    console.error("預載設定失敗:", error);
                    messageDiv.textContent = "系統初始化失敗，請檢查設定檔。";
                    messageDiv.className = "fail";
                });
        });

        // --- 處理一般登入 ---[cite: 5]
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const submitBtn = this.querySelector('button[type="submit"]');
            if (submitBtn.disabled) return;

            if (!gasUrl) {
                alert("API 尚未就緒，請稍後再試。");
                return;
            }

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            messageDiv.textContent = "登入中...";
            messageDiv.className = "";
            setButtonLoading(submitBtn, true, "登入中...");

            fetch(gasUrl, {
                method: "POST",
                mode: "cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "login",
                    username: username,
                    password: password
                })
            })
                .then(response => response.json())
                .then(async data => {
                    if (data.status === "success") {
                        userSession.username = username;
                        userSession.nickname = data.nickname;
                        userSession.rowIndex = data.rowIndex;

                        if (data.isFirstLogin) {
                            messageDiv.textContent = "";
                            document.getElementById('loginBlock').classList.add('hidden');
                            document.getElementById('firstLoginBlock').classList.remove('hidden');
                        } else {
                            messageDiv.textContent = "登入成功，正在導向主頁...";
                            messageDiv.className = "success";

                            // 建立一般登入快取驗證憑證[cite: 3]
                            await AuthGuard.createSession(username, data.nickname, password, "student");

                            // 👑 樹莓派新邏輯：判定是否為管理員帳號（學號 >= 493028）
                            setTimeout(() => { 
                                if (data.role === "admin") {
                                    window.location.href = "admin.html"; 
                                } else {
                                    window.location.href = "index.html"; 
                                }
                            }, 1000);
                        }
                    } else {
                        messageDiv.textContent = data.message;
                        messageDiv.className = "fail";
                        setButtonLoading(submitBtn, false);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    messageDiv.textContent = "系統連線錯誤。";
                    messageDiv.className = "fail";
                    setButtonLoading(submitBtn, false);
                });
        });

        // --- 處理首次登入的資料更新 ---[cite: 5]
        document.getElementById('profileForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const submitBtn = this.querySelector('button[type="submit"]');
            if (submitBtn.disabled) return;

            if (!gasUrl) return;

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value;

            if (newPassword !== confirmPassword) {
                messageDiv.textContent = "兩次輸入的密碼不一致！";
                messageDiv.className = "fail";
                return;
            }

            messageDiv.textContent = "正在更新資料...";
            messageDiv.className = "";
            setButtonLoading(submitBtn, true, "儲存中...");

            fetch(gasUrl, {
                method: "POST",
                mode: "cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "updateProfile",
                    rowIndex: userSession.rowIndex,
                    newPassword: newPassword,
                    email: email
                })
            })
                .then(response => response.json())
                .then(async data => {
                    if (data.status === "success") {
                        messageDiv.textContent = "設定成功！正在登入主頁...";
                        messageDiv.className = "success";

                        await AuthGuard.createSession(userSession.username, userSession.nickname, newPassword, "student");

                        setTimeout(() => { window.location.href = "index.html"; }, 1500);
                    } else {
                        messageDiv.textContent = data.message;
                        messageDiv.className = "fail";
                        setButtonLoading(submitBtn, false);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    messageDiv.textContent = "更新失敗，請檢查網路連線。";
                    messageDiv.className = "fail";
                    setButtonLoading(submitBtn, false);
                });
        });

        // --- 忘記密碼介面切換邏輯 ---[cite: 5]
        const loginBlock = document.getElementById('loginBlock');
        const forgotPasswordBlock = document.getElementById('forgotPasswordBlock');
        
        document.getElementById('toForgotBtn').addEventListener('click', (e) => {
            e.preventDefault();
            loginBlock.classList.add('hidden');
            forgotPasswordBlock.classList.remove('hidden');
            messageDiv.textContent = "";
        });

        document.getElementById('backToLoginBtn').addEventListener('click', () => {
            forgotPasswordBlock.classList.add('hidden');
            loginBlock.classList.remove('hidden');
            messageDiv.textContent = "";
        });

        // --- 步驟1：發送驗證碼 ---[cite: 5]
        document.getElementById('sendCodeBtn').addEventListener('click', function() {
            const usernameInput = document.getElementById('forgotUsername');
            const username = usernameInput.value.trim();
            
            if(!username) {
                messageDiv.textContent = "請先輸入帳號！";
                messageDiv.className = "fail";
                return;
            }
            
            messageDiv.textContent = "正在查詢並發送驗證碼...";
            messageDiv.className = "";
            setButtonLoading(this, true, "發送中...");
            
            fetch(gasUrl, {
                method: "POST",
                mode: "cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "sendResetCode",
                    username: username
                })
            })
            .then(res => res.json())
            .then(data => {
                setButtonLoading(this, false);
                if(data.status === "success") {
                    messageDiv.textContent = `${data.message} 已寄至：${data.maskedEmail}`;
                    messageDiv.className = "success";
                    
                    usernameInput.disabled = true;
                    document.getElementById('resetCode').disabled = false;
                    document.getElementById('forgotNewPassword').disabled = false;
                    document.getElementById('forgotConfirmPassword').disabled = false;
                    document.getElementById('resetSubmitBtn').disabled = false;
                } else {
                    messageDiv.textContent = data.message;
                    messageDiv.className = "fail";
                }
            })
            .catch(err => {
                console.error(err);
                messageDiv.textContent = "連線失敗，請檢查網路。";
                messageDiv.className = "fail";
                setButtonLoading(this, false);
            });
        });

        // --- 步驟2：驗證並提交重設密碼 ---[cite: 5]
        document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('resetSubmitBtn');
            if(submitBtn.disabled) return;
            
            const username = document.getElementById('forgotUsername').value.trim();
            const code = document.getElementById('resetCode').value.trim();
            const newPassword = document.getElementById('forgotNewPassword').value;
            const confirmPassword = document.getElementById('forgotConfirmPassword').value;
            
            if(newPassword !== confirmPassword) {
                messageDiv.textContent = "新密碼與確認密碼不一致！";
                messageDiv.className = "fail";
                return;
            }
            
            messageDiv.textContent = "正在驗證並重設密碼...";
            messageDiv.className = "";
            setButtonLoading(submitBtn, true, "處理中...");
            
            fetch(gasUrl, {
                method: "POST",
                mode: "cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "resetPassword",
                    username: username,
                    code: code,
                    newPassword: newPassword
                })
            })
            .then(res => res.json())
            .then(data => {
                setButtonLoading(submitBtn, false);
                if(data.status === "success") {
                    messageDiv.textContent = data.message;
                    messageDiv.className = "success";
                    
                    setTimeout(() => {
                        document.getElementById('resetPasswordForm').reset();
                        document.getElementById('forgotUsername').disabled = false;
                        document.getElementById('forgotUsername').value = "";
                        document.getElementById('resetCode').disabled = true;
                        document.getElementById('forgotNewPassword').disabled = true;
                        document.getElementById('forgotConfirmPassword').disabled = true;
                        submitBtn.disabled = true;
                        
                        forgotPasswordBlock.classList.add('hidden');
                        loginBlock.classList.remove('hidden');
                        messageDiv.textContent = "請使用新密碼登入。";
                        messageDiv.className = "success";
                    }, 2000);
                } else {
                    messageDiv.textContent = data.message;
                    messageDiv.className = "fail";
                }
            })
            .catch(err => {
                console.error(err);
                messageDiv.textContent = "密碼重設失敗。";
                messageDiv.className = "fail";
                setButtonLoading(submitBtn, false);
            });
        });

        // --- 處理密碼眼睛顯示與隱藏點擊邏輯 ---[cite: 5]
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                
                if (!passwordInput) return;

                const eyeOpenPath = `<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />`;
                const eyeClosePath = `<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.815 7.815 3 3m-3-3a10.459 10.459 0 0 1-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />`;

                const svg = this.querySelector('svg');

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    svg.innerHTML = eyeClosePath;
                } else {
                    passwordInput.type = 'password';
                    svg.innerHTML = eyeOpenPath;
                }
            });
        });
    </script>
</body>

</html>
