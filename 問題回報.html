<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" type="png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高一智班務系統 - 問題回報</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #e67e22;
            --dark-color: #2c3e50;
            --light-bg: #f8f9fa;
            --border-color: #e0e0e0;
            --green-color: #2ecc71;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
        body { background-color: var(--light-bg); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--light-bg); padding-bottom: 15px; margin-bottom: 25px; }
        .back-btn { background: var(--dark-color); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .back-btn:hover { background: #1a252f; }
        
        .user-info { background: #f1f4f6; padding: 12px 15px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; color: #555; display: flex; justify-content: space-between; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--dark-color); }
        
        select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 15px; background: white; outline: none; transition: border 0.2s; }
        select:focus, textarea:focus { border-color: var(--primary-color); }
        textarea { resize: vertical; min-height: 150px; }
        
        .submit-btn { background: var(--primary-color); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        .submit-btn:hover { background: #d35400; }
        .submit-btn:disabled { background: #bdc3c7; cursor: not-allowed; }

        .status-msg { text-align: center; margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fa-solid fa-triangle-exclamation" style="color:var(--primary-color);"></i> 問題與意見回報</h2>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> 返回首頁</a>
    </div>

    <div class="user-info">
        <div><i class="fa-solid fa-user-pen"></i> 回報人：<span id="userNameTxt" style="font-weight:700;">載入中...</span></div>
        <div>身分驗證成功</div>
    </div>

    <div class="form-group">
        <label for="reportType">問題類型</label>
        <select id="reportType">
            <option value="網頁系統 Bug 回報">網頁系統 Bug 回報（無法登入、網頁破版、功能沒反應）</option>
            <option value="成績數據有誤">成績數據有誤（成績登記與實得分數不符）</option>
            <option value="班務意見提出">班務意見提出（對班級事務、活動的點子與建言）</option>
            <option value="其他事務反映">其他事務反映</option>
        </select>
    </div>

    <div class="form-group">
        <label for="reportContent">詳細內容敘述</label>
        <textarea id="reportContent" placeholder="請詳細說明您遇到的問題或想提出的建言，以便老師或幹部協助處理..."></textarea>
    </div>

    <button class="submit-btn" id="submitBtn"><i class="fa-solid fa-paper-plane"></i> 安全提交回報</button>
    <div class="status-msg" id="statusMsg"></div>
</div>

<script>
    let gasUrl = "";
    let username = "";
    let nickname = "";

    window.onload = function() {
        const isLoggedIn = localStorage.getItem("isLoggedIn");
        username = localStorage.getItem("username");
        nickname = localStorage.getItem("nickname");

        if (isLoggedIn !== "true" || !username || !nickname) {
            alert("驗證逾時，請重新登入！");
            window.location.href = "login.html";
            return;
        }

        // 畫面上渲染使用者資訊
        document.getElementById('userNameTxt').textContent = `${nickname} (${username})`;

        fetch('api.json')
            .then(res => res.json())
            .then(config => { gasUrl = config.GAS_WEB_APP_URL; })
            .catch(err => console.error("設定檔讀取失敗"));
    };

    document.getElementById('submitBtn').addEventListener('click', function() {
        const content = document.getElementById('reportContent').value.trim();
        const type = document.getElementById('reportType').value;
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('statusMsg');

        if (!content) {
            alert("請填寫回報內容後再送出！");
            return;
        }

        if (!gasUrl) {
            alert("系統尚未與雲端資料庫完成連線，請稍後。");
            return;
        }

        // 💡 啟用防防重複點擊機制
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在安全寫入雲端資料庫...';
        msg.style.display = "block";
        msg.style.color = "#7f8c8d";
        msg.textContent = "傳送中，請勿關閉視窗...";

        fetch(gasUrl, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
                action: "submitReport",
                username: username,
                nickname: nickname,
                type: type,
                content: content
            })
        })
        .then(res => res.json())
        .then(resData => {
            if (resData.status === "success") {
                msg.style.color = "var(--green-color)";
                msg.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${resData.message}`;
                document.getElementById('reportContent').value = ""; // 清空輸入框
                
                // 3秒後自動轉跳回首頁
                setTimeout(() => { window.location.href = "index.html"; }, 3000);
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 安全提交回報';
                msg.style.color = "red";
                msg.textContent = resData.message;
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 安全提交回報';
            msg.style.color = "red";
            msg.textContent = "連線超時，請檢查網路後重新提交。";
        });
    });
</script>
</body>
</html>
