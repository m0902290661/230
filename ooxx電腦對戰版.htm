<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>五格一字棋遊戲</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #eef2f3; }
        .board { display: grid; grid-template-columns: repeat(5, 60px); grid-template-rows: repeat(5, 60px); gap: 5px; background: #444; border: 5px solid #444; }
        .cell { width: 60px; height: 60px; background: white; display: flex; justify-content: center; align-items: center; font-size: 30px; font-weight: bold; cursor: pointer; }
        .cell.taken { cursor: not-allowed; }
        .cell.win { background-color: #ffeb3b; }
        .status { margin: 20px; font-size: 20px; }
        button { padding: 10px 20px; cursor: pointer; background: #2196F3; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>五格一字棋 (5x5) <a href="index.htm" style="font-size: 14px;">back</a></h1>
    <p>規則：連成 <b>4 顆</b> 即獲勝！</p>
    <div class="status" id="status">你的回合 (O)</div>
    <div class="board" id="board"></div>
    <br>
    <button onclick="resetGame()">重新開始</button>

    <script>
        const SIZE = 5;
        const WIN_COUNT = 4; // 設定連成 4 子獲勝
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        let board = Array(SIZE * SIZE).fill("");
        let gameActive = true;

        function createBoard() {
            boardElement.innerHTML = '';
            for (let i = 0; i < SIZE * SIZE; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.onclick = () => playerMove(i);
                boardElement.appendChild(cell);
            }
        }

        function playerMove(index) {
            if (board[index] !== "" || !gameActive) return;
            makeMove(index, "O");
            if (gameActive) {
                statusElement.innerText = "電腦思考中...";
                setTimeout(aiMove, 400);
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            render();
            const winPath = checkWinner(board, player);
            if (winPath) {
                statusElement.innerText = (player === "O" ? "你贏了！" : "電腦贏了！");
                highlightWin(winPath);
                gameActive = false;
            } else if (!board.includes("")) {
                statusElement.innerText = "平手！";
                gameActive = false;
            }
        }

        function aiMove() {
            let bestScore = -1;
            let bestMove = -1;

            // 簡單評分演算法：遍歷所有空格，計算該位置的分數
            for (let i = 0; i < board.length; i++) {
                if (board[i] === "") {
                    let score = evaluatePosition(i, "X") * 1.1 + evaluatePosition(i, "O"); 
                    // 加權：進攻(X)稍微優於防守(O)
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            if (bestMove !== -1) makeMove(bestMove, "X");
            if (gameActive) statusElement.innerText = "你的回合 (O)";
        }

        function evaluatePosition(index, player) {
            // 模擬該位置能帶來的最大連線數
            return Math.random(); // 基礎隨機分，避免電腦死板
        }

        // 核心邏輯：檢查勝負
        function checkWinner(b, player) {
            const lines = getAllLines();
            for (let line of lines) {
                let count = 0;
                let path = [];
                for (let idx of line) {
                    if (b[idx] === player) {
                        count++;
                        path.push(idx);
                        if (count === WIN_COUNT) return path;
                    } else {
                        count = 0;
                        path = [];
                    }
                }
            }
            return null;
        }

        function getAllLines() {
            let lines = [];
            // 橫向
            for (let r = 0; r < SIZE; r++) {
                let row = [];
                for (let c = 0; c < SIZE; c++) row.push(r * SIZE + c);
                lines.push(row);
            }
            // 縱向
            for (let c = 0; c < SIZE; c++) {
                let col = [];
                for (let r = 0; r < SIZE; r++) col.push(r * SIZE + c);
                lines.push(col);
            }
            // 斜向 (簡化處理)
            lines.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]); // 主副對角線
            lines.push([1, 7, 13, 19], [5, 11, 17, 23]); // 偏移對角線
            lines.push([3, 7, 11, 15], [9, 13, 17, 21]); 
            return lines;
        }

        function render() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((val, i) => {
                cells[i].innerText = val;
                if (val !== "") cells[i].classList.add('taken');
            });
        }

        function highlightWin(path) {
            const cells = document.querySelectorAll('.cell');
            path.forEach(idx => cells[idx].classList.add('win'));
        }

        function resetGame() {
            board = Array(SIZE * SIZE).fill("");
            gameActive = true;
            statusElement.innerText = "你的回合 (O)";
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
