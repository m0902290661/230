<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>2048 終極 AI 旗艦版</title>
    <style>
        body { background: #faf8ef; font-family: "Clear Sans", sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        #game-container { width: 400px; }
        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
        #score-container { background: #bbada0; padding: 10px 20px; color: white; border-radius: 6px; font-weight: bold; text-align: center; min-width: 80px; }
        #grid { background: #bbada0; width: 400px; height: 400px; border-radius: 6px; position: relative; padding: 15px; box-sizing: border-box; }
        .cell { width: 80px; height: 80px; background: rgba(238, 228, 218, 0.35); border-radius: 3px; float: left; margin: 5px; line-height: 80px; text-align: center; font-size: 35px; font-weight: bold; color: #776e65; transition: all 0.1s ease; }
        .n-2 { background: #eee4da; } .n-4 { background: #ede0c8; } .n-8 { background: #f2b179; color: white; }
        .n-16 { background: #f59563; color: white; } .n-32 { background: #f67c5f; color: white; }
        .n-64 { background: #f65e3b; color: white; } .n-128 { background: #edcf72; color: white; font-size: 30px; }
        .n-256 { background: #edcc61; color: white; font-size: 30px; } .n-512 { background: #edc850; color: white; font-size: 30px; }
        .n-1024 { background: #edc53f; color: white; font-size: 25px; } .n-2048 { background: #edc22e; color: white; font-size: 25px; }
        .n-4096 { background: #3c3a32; color: white; font-size: 25px; }
        .controls { margin-top: 20px; display: flex; gap: 10px; width: 100%; }
        button { padding: 12px; font-size: 16px; cursor: pointer; background: #8f7a66; color: white; border: none; border-radius: 6px; flex: 1; font-weight: bold; }
        button:hover { background: #7f6a56; }
        .ai-status { margin-top: 15px; padding: 10px; background: #eee4da; border-radius: 6px; color: #776e65; font-weight: bold; width: 100%; text-align: center; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <h1>2048 <span style="font-size: 0.5em; color: #8f7a66;">Expertimax AI</span></h1>
        <div id="score-container">SCORE<br><span id="score">0</span></div>
    </div>
    
    <div id="grid"></div>

    <div class="controls">
        <button onclick="initGame()">重新開始</button>
        <button id="ai-btn" onclick="toggleAI()">開啟終極 AI</button>
    </div>
    <div class="ai-status" id="status">模式：手動操作 (方向鍵)</div>
</div>

<script>
    let board = [];
    let score = 0;
    let isAI = false;
    let aiInterval = null;

    // 權重矩陣：導向右下角
    const WEIGHT_MAP = [
        [Math.pow(4, 1), Math.pow(4, 2), Math.pow(4, 3), Math.pow(4, 4)],
        [Math.pow(4, 8), Math.pow(4, 7), Math.pow(4, 6), Math.pow(4, 5)],
        [Math.pow(4, 9), Math.pow(4, 10), Math.pow(4, 11), Math.pow(4, 12)],
        [Math.pow(4, 16), Math.pow(4, 15), Math.pow(4, 14), Math.pow(4, 13)]
    ];

    function initGame() {
        board = Array(4).fill().map(() => Array(4).fill(0));
        score = 0;
        addRandomTile();
        addRandomTile();
        updateView();
        if (isAI) toggleAI(); 
    }

    function addRandomTile() {
        let empty = [];
        for(let r=0; r<4; r++) for(let c=0; c<4; c++) if(board[r][c]===0) empty.push({r,c});
        if(empty.length > 0) {
            let cell = empty[Math.floor(Math.random()*empty.length)];
            board[cell.r][cell.c] = Math.random() < 0.9 ? 2 : 4;
        }
    }

    function updateView() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        board.flat().forEach(val => {
            let cell = document.createElement('div');
            cell.className = 'cell' + (val > 0 ? ` n-${val}` : '');
            cell.textContent = val > 0 ? val : '';
            grid.appendChild(cell);
        });
        document.getElementById('score').textContent = score;
    }

    function getNextState(dir, currentBoard) {
        let tempBoard = JSON.parse(JSON.stringify(currentBoard));
        let moved = false, gained = 0;
        const rotate = (m) => m[0].map((_, i) => m.map(row => row[i]).reverse());
        let rots = {'ArrowUp':3, 'ArrowRight':2, 'ArrowDown':1, 'ArrowLeft':0}[dir];
        for (let i = 0; i < rots; i++) tempBoard = rotate(tempBoard);
        for (let i = 0; i < 4; i++) {
            let row = tempBoard[i].filter(v => v !== 0);
            for (let j = 0; j < row.length - 1; j++) {
                if (row[j] === row[j+1]) { row[j] *= 2; gained += row[j]; row.splice(j+1, 1); }
            }
            while (row.length < 4) row.push(0);
            if (JSON.stringify(tempBoard[i]) !== JSON.stringify(row)) moved = true;
            tempBoard[i] = row;
        }
        for (let i = 0; i < (4 - rots) % 4; i++) tempBoard = rotate(tempBoard);
        return { moved, board: tempBoard, gained };
    }

    // 評估函數：核心 AI 智慧來源
    function evaluate(b) {
        let empty = 0, smoothness = 0, monotonicity = 0, weightedSum = 0;
        for(let r=0; r<4; r++) {
            for(let c=0; c<4; c++) {
                if(b[r][c] === 0) { empty++; continue; }
                let val = Math.log2(b[r][c]);
                weightedSum += val * WEIGHT_MAP[r][c];
                // 平滑度
                if(c<3 && b[r][c+1]!==0) smoothness -= Math.abs(val - Math.log2(b[r][c+1]));
                if(r<3 && b[r+1][c]!==0) smoothness -= Math.abs(val - Math.log2(b[r+1][c]));
            }
        }
        return weightedSum + (empty * empty * 20) + (smoothness * 5);
    }

    // Expectimax 遞迴搜尋
    function expectimax(b, depth, isPlayer) {
        if (depth === 0) return evaluate(b);
        const dirs = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
        if (isPlayer) {
            let maxEval = -Infinity;
            dirs.forEach(d => {
                let res = getNextState(d, b);
                if (res.moved) maxEval = Math.max(maxEval, expectimax(res.board, depth - 1, false));
            });
            return maxEval;
        } else {
            let avgEval = 0, empty = [];
            for(let r=0; r<4; r++) for(let c=0; c<4; c++) if(b[r][c]===0) empty.push({r,c});
            if(empty.length === 0) return evaluate(b);
            let limit = empty.slice(0, 5); // 限制取樣提升效能
            limit.forEach(c => {
                let nb = JSON.parse(JSON.stringify(b));
                nb[c.r][c.c] = 2;
                avgEval += expectimax(nb, depth - 1, true);
            });
            return avgEval / limit.length;
        }
    }

    function aiSmartStep() {
        const dirs = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
        let bestDir = null, maxEval = -Infinity;
        let emptyCount = board.flat().filter(v => v === 0).length;
        let depth = emptyCount < 3 ? 5 : 3; // 格子越少，思考越深

        dirs.forEach(d => {
            let res = getNextState(d, board);
            if (res.moved) {
                let evalVal = expectimax(res.board, depth, false);
                if (evalVal > maxEval) { maxEval = evalVal; bestDir = d; }
            }
        });

        if (bestDir) {
            let res = getNextState(bestDir, board);
            board = res.board; score += res.gained;
            addRandomTile(); updateView();
        } else if (board.flat().filter(v => v === 0).length === 0) {
            toggleAI(); alert("遊戲結束！分數: " + score);
        }
    }

    function toggleAI() {
        isAI = !isAI;
        document.getElementById('ai-btn').textContent = isAI ? "停止 AI" : "開啟終極 AI";
        document.getElementById('status').textContent = isAI ? "AI 正在預判未來..." : "模式：手動操作";
        if (isAI) aiInterval = setInterval(aiSmartStep, 80);
        else clearInterval(aiInterval);
    }

    window.addEventListener('keydown', e => {
        if (!isAI && e.key.startsWith('Arrow')) {
            let res = getNextState(e.key, board);
            if (res.moved) { board = res.board; score += res.gained; addRandomTile(); updateView(); }
        }
    });

    initGame();
</script>
</body>
</html>
