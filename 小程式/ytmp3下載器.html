<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music 本地下載器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 550px;
        }
        h2 { margin-bottom: 1.2rem; color: #ff0000; text-align: center; }
        .description { font-size: 0.85rem; color: #aaa; margin-bottom: 1rem; }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            font-family: monospace;
            resize: vertical;
            margin-bottom: 1rem;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #ff0000;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #cc0000; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        /* 進度條樣式 */
        .progress-box {
            width: 100%;
            background-color: #333;
            border-radius: 8px;
            height: 18px;
            overflow: hidden;
            margin-top: 1.2rem;
            display: none;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ff0000;
            transition: width 0.2s;
        }

        /* 日誌視窗樣式 */
        .log-box {
            margin-top: 1rem;
            background-color: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            height: 160px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            color: #00ff66;
            display: none;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>YT Music 本地下載器</h2>
    
    <div class="description">
        • 每行貼上一個 YouTube / YT Music 連結<br>
        • 音訊轉檔後將自動觸發瀏覽器下載至本地
    </div>

    <textarea id="urlsInput" placeholder="https://music.youtube.com/watch?v=..."></textarea>
    
    <button id="downloadBtn" onclick="startBatchDownload()">開始下載至本地</button>
    
    <div id="progressBox" class="progress-box">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="logBox" class="log-box"></div>
</div>

<script>
    const API_URL = "https://ytmusic.dafuntea.com/api/download_stream";

    async function startBatchDownload() {
        const urlsInput = document.getElementById('urlsInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressBox = document.getElementById('progressBox');
        const progressBar = document.getElementById('progressBar');
        const logBox = document.getElementById('logBox');

        const rawText = urlsInput.value.trim();
        if (!rawText) return alert('請先輸入網址！');

        const urls = rawText.split('\n').map(u => u.trim()).filter(u => u.length > 0);

        // 重置與顯示 UI
        downloadBtn.disabled = true;
        progressBox.style.display = 'block';
        logBox.style.display = 'block';
        progressBar.style.width = '0%';
        logBox.innerHTML = '正在初始化連線...\n';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ urls })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n\n');
                buffer = lines.pop(); // 保留尚未完整的行

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = JSON.parse(line.replace('data: ', ''));

                        if (data.type === 'progress') {
                            progressBar.style.width = `${data.percent}%`;
                            appendLog(data.log);
                        } else if (data.type === 'log' || data.type === 'error') {
                            appendLog(data.log);
                        } else if (data.type === 'file') {
                            // 收到本地檔案 Base64 數據，觸發自動下載
                            appendLog(`💾 正將 [${data.filename}] 存入本地...`);
                            downloadBase64File(data.data, data.filename);
                        } else if (data.type === 'complete') {
                            appendLog(data.log);
                            progressBar.style.width = '100%';
                        }
                    }
                }
            }

        } catch (error) {
            appendLog(`❌ 連線錯誤: ${error.message}`);
        } finally {
            downloadBtn.disabled = false;
        }
    }

    function appendLog(msg) {
        const logBox = document.getElementById('logBox');
        logBox.innerHTML += msg + '\n';
        logBox.scrollTop = logBox.scrollHeight; // 自動捲動至最底部
    }

    // 觸發瀏覽器下載本地檔案
    function downloadBase64File(base64Data, filename) {
        const link = document.createElement('a');
        link.href = 'data:audio/mp3;base64,' + base64Data;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
